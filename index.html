<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="e-Fatura, e-Arşiv, e-İrsaliye XML ve GİB Zarf XML dosyalarını tekli veya toplu olarak PDF'e dönüştürün. Dosyalar bilgisayarınızda işlenir." />
    <title>ZarfPDF</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='2' fill='%232b4bf2'/><path d='M8 11l8 6 8-6M8 10h16v13H8z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>" />
    <script>
      try {
        const saved = localStorage.getItem('zarfpdf_theme_preference');
        const isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.mode = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.dataset.mode = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
