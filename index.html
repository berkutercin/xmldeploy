<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="e-Fatura, e-Arşiv, e-İrsaliye XML ve GİB Zarf XML dosyalarını tekli veya toplu olarak PDF'e dönüştürün. Dosyalar bilgisayarınızda işlenir." />
    <title>ZarfPDF</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2316181a'/><rect x='9.5' y='4.5' width='15' height='21' fill='%23fdfcfd'/><path d='M9.5 4.5 H24.5 L17 11.5 Z' fill='%23c9c7c4'/><circle cx='10' cy='24.5' r='5' fill='%23dcddf3' stroke='%2316181a' stroke-width='1.2'/><circle cx='10' cy='24.5' r='2.9' fill='none' stroke='%232e3170' stroke-width='0.5' opacity='0.7'/></svg>" />
    <script>
      try {
        const saved = localStorage.getItem('zarfpdf_theme_preference');
        const isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.mode = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.dataset.mode = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
